<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="hero-text">
  <h1>Weather At Your Fingertips</h1>
  <p>Just type any city name and get live temperature, weather condition and real-time updates instantly.</p>
  <button class="cta-btn">Check Weather Now</button>
</div>
    <div class="container">
        <h2>WeatherApp</h2>
        <input type="text" class="input" placeholder="Enter City">
        <button class="btn">Search</button>
        <p class="temp"></p>
        <p class="city"></p>
        <p class="detail"></p>
        <p class="icon"></p>
    </div>
    <script src="weather.js"></script>
</body>
</html>
